<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>SVG Shapes</title>
</head>
<body>

    <h2>SVG 圓形與矩形重疊範例</h2>

    <svg width="400" height="300">
        
        <rect x="50" y="50" width="150" height="150" 
              fill="blue" stroke="black" stroke-width="3" />

        <circle cx="200" cy="125" r="60" 
                fill="yellow" stroke="red" stroke-width="4" />

    </svg>

</body>
